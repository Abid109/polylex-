name: Build Android APK

# Runs on every push to main, on demand, and (to publish a Release
# with the APK attached) whenever you push a version tag like v1.0.0
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web-app / Capacitor dependencies
        run: npm install

      - name: Sync latest web assets into the native project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: polylex-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Only runs when you push a tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`).
      # Creates a GitHub Release with the APK attached at a stable download link.
      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
