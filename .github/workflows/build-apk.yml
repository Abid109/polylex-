name: Build Android APK

# Runs on every push to main, on demand, and (to publish a Release
# with the APK attached) whenever you push a version tag like v1.0.0
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install web-app / Capacitor dependencies
        run: npm install

      - name: Sync latest web assets into the native project
        run: npx cap sync android

      - name: Build debug APK
        id: gradle_build
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > /tmp/gradle.log 2>&1
          code=$?
          set -e
          tail -n 400 /tmp/gradle.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Post build log if it failed
        if: steps.gradle_build.outputs.exit_code != '0'
        run: |
          tail -c 55000 /tmp/gradle.log > /tmp/gradle_tail.log
          jq -n --arg title "CI build log: ${{ github.sha }}" \
                --rawfile body /tmp/gradle_tail.log \
                '{title: $title, body: ("```\n" + $body + "\n```")}' > /tmp/issue.json
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d @/tmp/issue.json
          exit 1

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: polylex-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Only runs when you push a tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`).
      # Creates a GitHub Release with the APK attached at a stable download link.
      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
